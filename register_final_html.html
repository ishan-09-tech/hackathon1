<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(18, 26, 43, 0.7);
      --ink: #eaf0ff;
      --muted: #8d9bb5;
      --line: rgba(120, 150, 220, 0.2);
      --accent: #5b8cff;
      --accent-2: #9b6bff;
      --accent-glow: rgba(91, 140, 255, 0.45);
      --error: #ff6b63;
      --ok: #4ade80;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      overflow-x: hidden;
    }

    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg::before {
      content: ""; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(120,150,220,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,150,220,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
      animation: gridMove 24s linear infinite;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; will-change: transform; }
    .o1 { width: 420px; height: 420px; background: #2f5bff; top: -120px; left: -100px; animation: drift1 18s ease-in-out infinite alternate; }
    .o2 { width: 380px; height: 380px; background: #8a4dff; bottom: -140px; right: -80px; animation: drift2 22s ease-in-out infinite alternate; }
    @keyframes gridMove { to { background-position: 48px 48px; } }
    @keyframes drift1 { to { transform: translate(180px, 120px) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-200px, -100px) scale(1.2); } }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: var(--card);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      padding: 32px 28px; border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: cardIn 0.9s var(--ease) both;
    }
    .card::before {
      content: ""; position: absolute; top: -1px; left: 12%; right: 12%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
    }
    h1 {
      margin: 0 0 6px; font-size: 1.7rem;
      background: linear-gradient(110deg, #fff 30%, #9db8ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: riseIn 0.8s var(--ease) 0.15s both;
    }
    .sub { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; animation: riseIn 0.8s var(--ease) 0.22s both; }
    .field { margin-bottom: 18px; animation: riseIn 0.8s var(--ease) both; }
    form > .field:nth-of-type(1) { animation-delay: 0.3s; }
    form > .field:nth-of-type(2) { animation-delay: 0.38s; }
    form > .field:nth-of-type(3) { animation-delay: 0.46s; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.92rem; transition: color 0.3s; }
    .field:focus-within label { color: var(--accent); }
    input {
      width: 100%; padding: 12px 14px; font-size: 1rem;
      border: 1px solid var(--line); border-radius: 10px;
      background: rgba(255,255,255,0.04); color: var(--ink);
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s, transform 0.3s var(--ease);
    }
    input::placeholder { color: #5a6882; }
    input:focus {
      outline: none; border-color: var(--accent);
      background: rgba(91,140,255,0.08);
      box-shadow: 0 0 0 4px rgba(91,140,255,0.18), 0 0 20px rgba(91,140,255,0.2);
      transform: translateY(-1px);
    }
    input.invalid { border-color: var(--error); animation: shake 0.4s; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 68px; }
    .toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 0.85rem;
      cursor: pointer; padding: 6px 8px; border-radius: 6px; transition: background 0.3s, color 0.3s;
    }
    .toggle:hover { background: rgba(91,140,255,0.15); color: #fff; }
    .hint { margin: 6px 0 0; font-size: 0.82rem; color: var(--muted); }
    .error { margin: 6px 0 0; font-size: 0.82rem; color: var(--error); min-height: 1em; }
    button.submit {
      position: relative; overflow: hidden;
      width: 100%; padding: 13px; border: 0; border-radius: 10px;
      background: linear-gradient(120deg, var(--accent), var(--accent-2)); background-size: 160% 160%;
      color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 6px 22px var(--accent-glow);
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
      animation: riseIn 0.8s var(--ease) 0.54s both, gradShift 6s ease infinite 1.4s;
    }
    button.submit::after {
      content: ""; position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: skewX(-20deg); transition: left 0.7s var(--ease);
    }
    button.submit:hover { transform: translateY(-3px); box-shadow: 0 10px 34px var(--accent-glow); }
    button.submit:hover::after { left: 140%; }
    button.submit:active { transform: translateY(-1px) scale(0.98); }
    button.submit:focus-visible { outline: 3px solid rgba(91,140,255,0.55); outline-offset: 2px; }
    .success { margin-top: 16px; color: var(--ok); font-weight: 600; text-align: center; animation: pop 0.6s var(--ease); }

    @keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(0.96); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes riseIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes gradShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.7); } 60% { transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div></div>

  <main class="card">
    <h1>Create your account</h1>
    <p class="sub">Enter your details to register.</p>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="e.g. Aman Sharma" required>
        <p class="error" id="nameError"></p>
      </div>

      <div class="field">
        <label for="roll">Roll number</label>
        <input type="text" id="roll" name="roll" placeholder="e.g. B23001" required>
        <p class="error" id="rollError"></p>
      </div>

      <div class="field">
        <label for="password">Create password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" autocomplete="new-password" required>
          <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
        </div>
        <p class="hint">At least 8 characters, with a letter and a number.</p>
        <p class="error" id="passwordError"></p>
      </div>

      <button type="submit" class="submit">Register</button>
      <p class="success" id="success" hidden>Registration successful!</p>
    </form>
    <p class="sub" style="margin:20px 0 0;text-align:center;">Already registered? <a href="login_html.html" style="color:var(--accent);font-weight:600;text-decoration:none;">Sign in</a> &middot; <a href="homepage_final_html.html" style="color:var(--accent);font-weight:600;text-decoration:none;">Home</a></p>
  </main>

  <script>
    const form = document.getElementById('registerForm');
    const nameInput = document.getElementById('name');
    const rollInput = document.getElementById('roll');
    const pwInput = document.getElementById('password');
    const toggle = document.getElementById('toggle');
    const success = document.getElementById('success');

    toggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Hide' : 'Show';
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    function setError(input, errorId, message) {
      document.getElementById(errorId).textContent = message;
      input.classList.toggle('invalid', Boolean(message));
      return !message;
    }

    async function hashPassword(text) {
      const bytes = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      success.hidden = true;

      const name = nameInput.value.trim();
      const roll = rollInput.value.trim();
      const pw = pwInput.value;

      const okName = setError(nameInput, 'nameError',
        name.length < 2 ? 'Enter your full name.' : '');
      const okRoll = setError(rollInput, 'rollError',
        !/^[A-Za-z0-9\-\/]{3,20}$/.test(roll) ? 'Enter a valid roll number (letters and numbers only).' : '');
      const okPw = setError(pwInput, 'passwordError',
        !(pw.length >= 8 && /[A-Za-z]/.test(pw) && /\d/.test(pw))
          ? 'Password must be 8+ characters with a letter and a number.' : '');

      if (okName && okRoll && okPw) {
        // Demo storage: saved in this browser only (localStorage).
        // For a real app, send this to your backend instead.
        let users = [];
        try { users = JSON.parse(localStorage.getItem('users')) || []; } catch (err) {}

        const exists = users.some(u => u.roll.toLowerCase() === roll.toLowerCase());
        if (!setError(rollInput, 'rollError', exists ? 'This roll number is already registered.' : '')) {
          return;
        }

        const passwordHash = await hashPassword(pw);
        users.push({ name, roll, passwordHash });
        localStorage.setItem('users', JSON.stringify(users));

        success.textContent = 'Registration successful! Taking you to sign in…';
        success.hidden = false;
        form.reset();
        setTimeout(() => { window.location.href = 'login_html.html'; }, 1400);
      }
    });
  </script>
</body>
</html>
